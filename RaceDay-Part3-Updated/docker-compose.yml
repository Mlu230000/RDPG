services:
  # 1. SQL Server (the API connects to this; schema + seed data are loaded by db-init)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - raceday-network

  # 2. One-shot job: runs raceday_schema.sql, then raceday_part3_migration.sql.
  #    Skips itself if the RaceDay database already has tables, so re-running
  #    `docker compose up` never wipes your data (the schema script drops tables).
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./raceday_schema.sql:/sql/raceday_schema.sql:ro
      - ./raceday_part3_migration.sql:/sql/raceday_part3_migration.sql:ro
      - ./docker/db-init.sh:/sql/db-init.sh:ro
    environment:
      - SQLCMDPASSWORD=Your_password123
    entrypoint: ["/bin/bash", "/sql/db-init.sh"]
    restart: "no"
    networks:
      - raceday-network

  # 3. Azure Storage Emulator (Azurite) for local blob testing
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: raceday-azurite
    ports:
      - "10000:10000"
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck"
    networks:
      - raceday-network

  # 4. RaceDay RESTful API (container listens on port 80)
  raceday-api:
    build:
      context: .
      dockerfile: RaceDay.Api/Dockerfile
    container_name: raceday-api
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=RaceDay;User Id=sa;Password=Your_password123;TrustServerCertificate=True;MultipleActiveResultSets=true;
      # Explicit Azurite endpoint: "UseDevelopmentStorage=true" means 127.0.0.1, which is the API container itself.
      - AzureBlobStorage__ConnectionString=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;
      # Host the browser uses to reach Azurite (stored in image URLs instead of the internal "azurite" host)
      - AzureBlobStorage__PublicBaseUrl=http://localhost:10000
      - Jwt__Key=RaceDaySouthAfricaSuperSecretKey2026!MustBe32CharsLong
    depends_on:
      db-init:
        condition: service_completed_successfully
      azurite:
        condition: service_started
    networks:
      - raceday-network

  # 5. RaceDay MVC Web app. Config key is RaceDayApi:BaseUrl; use the service name, not localhost.
  raceday-web:
    build:
      context: .
      dockerfile: RaceDay.Web/Dockerfile
    container_name: raceday-web
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RaceDayApi__BaseUrl=http://raceday-api:80/
    depends_on:
      - raceday-api
    networks:
      - raceday-network

networks:
  raceday-network:
    driver: bridge
